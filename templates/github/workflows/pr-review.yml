# Stage 5: every pull request gets the same review passes. Findings inform the merge; they never approve it.
# Untested scaffold. The review runs under the workflow's identity, not the author's.
name: pr-review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review against REVIEW.md, the spec and the plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          claude -p "Review the diff in pr.diff following REVIEW.md. Find the change's intent/<name>/spec.md and plan.md and check the diff against them. Tag each finding with its pass and severity. Write the review to review.md." --allowedTools "Read,Grep,Glob,Write"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md
