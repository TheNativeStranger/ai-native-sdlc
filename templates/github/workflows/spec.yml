# Stage 2 trigger: when an intent merges, write its spec and open it as a pull request.
# Untested scaffold. Run /ai-native-sdlc:spec by hand until the routine holds, then enable this.
name: spec
on:
  push:
    branches: [main]
    paths: ['intent/*/intent.md']
permissions:
  contents: write
  pull-requests: write
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: npm install -g @anthropic-ai/claude-code
      - name: Write the spec for each newly accepted intent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for intent in $(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'intent/*/intent.md'); do
            name=$(basename "$(dirname "$intent")")
            git checkout -b "spec/$name"
            claude -p "Read $intent and write the requirements and design spec to intent/$name/spec.md. Apply the policy skills. Describe clearly any areas of concern, especially where you cannot satisfy contradicting policies." --allowedTools "Read,Grep,Glob,Write,Edit,Skill"
            git add "intent/$name/spec.md"
            git -c user.name="sdlc-agent" -c user.email="sdlc-agent@users.noreply.github.com" commit -m "Spec for $name"
            git push -u origin "spec/$name"
            gh pr create --title "Spec: $name" --body "Written from the accepted intent. The product owner seat accepts by merging."
            git checkout -
          done
