# Stage 4: regression-test the configuration that steers the agent.
# Untested scaffold. Needs ANTHROPIC_API_KEY with a budget for eval runs.
name: agent-evals
on:
  pull_request:
    paths: ['CLAUDE.md', '.claude/**', 'sdlc/config.json']
  schedule:
    - cron: '0 2 * * *'
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          failed=0
          for eval in evals/*.json; do
            git stash -u -q || true
            claude -p "$(jq -r '.prompt' "$eval")" --allowedTools "Read,Edit,Write,Bash(make test)" --output-format json > result.json || true
            bash evals/check.sh "$eval" result.json || failed=$((failed+1))
            git checkout -q . && git clean -fdq -e result.json
          done
          echo "failed evals: $failed"
          test "$failed" -eq 0
