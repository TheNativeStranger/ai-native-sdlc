# Stage 5: the agent prepares a release up to the production gate. A person authorizes production.
# Untested scaffold. Configure the 'production' environment in the repository settings with a required reviewer:
# that reviewer is the release manager seat.
name: release
on:
  push:
    branches: [main]
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "Replace with your staging deploy command."
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          RELEASE_APPROVAL: ${{ github.run_id }}
        run: echo "Replace with your production deploy command. This job runs only after the environment's reviewer approves."
