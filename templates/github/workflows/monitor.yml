# Stage 6: a deterministic script watches one metric; the agent is invoked only when a band is breached.
# Untested scaffold. Replace the 'Collect the metric' step with a query to your metrics store.
name: monitor
on:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the metric
        run: echo "[]" > series.json
      - name: Detect
        id: detect
        run: |
          set +e
          python3 ops/detect.py ops/bands.json series.json > detection.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat detection.json
      - name: Diagnose and write the finding as an intent
        if: steps.detect.outputs.code == '20' || steps.detect.outputs.code == '30'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @anthropic-ai/claude-code
          name="finding-$(date +%Y%m%d-%H%M)"
          git checkout -b "intent/$name"
          claude -p "The detection in detection.json breached a band. Diagnose read-only and write the finding to intent/$name/intent.md in the intent format: the anomaly and its evidence, a proposed outcome, affected systems, open questions." --allowedTools "Read,Grep,Glob,Write"
          git add "intent/$name" && git -c user.name="sdlc-agent" -c user.email="sdlc-agent@users.noreply.github.com" commit -m "Finding: $name"
          git push -u origin "intent/$name"
          gh pr create --title "Finding: $name" --body "Written by the monitoring job. The service owner seat triages: fix now, schedule or dismiss."
